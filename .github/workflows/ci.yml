name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check backend
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t windfidelity .
      - run: docker run -d --name wf -p 8000:8000 windfidelity
      - name: Smoke test the running container
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/api/v1/snapshot | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['coverage']['matched_hours'] == 744, d['coverage']"
          curl -fs http://localhost:8000/ | grep -q 'id="root"'
      - name: Container logs on failure
        if: failure()
        run: docker logs wf